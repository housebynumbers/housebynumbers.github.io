<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="K-apt 단지 기본정보로 본 시도·서울 구별 아파트 단지 나이 지도. 숫자로 읽는 집.">
<title>아파트 단지 나이 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* Layout: 연구노트 한 장 — 위 제목·단추, 아래 지도(왼쪽)와 표(오른쪽)가 서로 연결. 휴대폰에선 지도가 위에 붙어 있고 표가 아래로 스크롤. 브랜드가 밝은 종이 한 가지라 밝은 모습으로 고정 */
:root{
  --paper:#FAFAF7; --sheet:#FFFFFF; --ink:#1D1F1C; --ink-2:#5A5E58; --rule:#DCDED8; --grid:#ECEDEA;
  --brand:#1E6B4F; --tint:#F1F7F3; --tint-2:#E4F2EA; --pick:#C0832F;
  --serif:"Nanum Myeongjo","Noto Serif KR",serif;
  --sans:"Nanum Gothic","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
.brandline{display:flex;align-items:center;gap:8px;color:var(--ink);font-family:var(--serif);font-weight:800;font-size:15px;margin-bottom:10px}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(1.4rem,3.2vw,2rem);line-height:1.25;margin:0;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--ink-2);max-width:60ch}
.controls{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.seg{display:inline-flex;border:1px solid var(--brand);flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;border:0;background:var(--sheet);color:var(--brand);padding:7px 12px;cursor:pointer;border-right:1px solid var(--brand)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;font-weight:700}
.seg button:focus-visible,.tbl tr:focus-visible,path.r:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--sheet);border:1px solid var(--rule);min-width:0}
.mapbox{position:sticky;top:env(safe-area-inset-top,0px);padding:12px}
#map{display:block;width:100%;height:auto}
.brandline svg{width:22px;height:22px;flex:none}
path.r{stroke:#fff;stroke-width:1;cursor:pointer;transition:fill .25s}
path.r.dim{opacity:.6}
.borders{fill:none;stroke:#fff;stroke-width:1.4;pointer-events:none}
.sel{fill:none;stroke:var(--ink);stroke-width:3;pointer-events:none}
.lbl{font-family:var(--sans);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke-width:4px;stroke-linejoin:round}
.lbl .v{font-weight:800}
.legend{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.ramp{height:10px;width:160px;background:linear-gradient(90deg,#E4F2EA,#8CC7A8,#3E9A6E,#1E7B57,#0E4A33)}
.info{border-top:1px solid var(--grid);margin-top:10px;padding-top:10px;min-height:92px;font-size:14px}
.info h3{font-family:var(--serif);font-weight:800;font-size:18px;margin:0 0 4px}
.info dl{display:grid;grid-template-columns:auto auto;gap:2px 16px;margin:0;font-variant-numeric:tabular-nums;width:max-content;max-width:100%}
.info dt{color:var(--ink-2)} .info dd{margin:0;text-align:right;font-weight:700}
.info .hint{color:var(--ink-2);margin:0}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{background:var(--brand);color:#fff;font-weight:700;text-align:right;padding:8px 8px;white-space:nowrap;cursor:pointer;position:sticky;top:0}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th[aria-sort]::after{content:" ▾";font-size:11px}
.tbl th[aria-sort="ascending"]::after{content:" ▴"}
.tbl td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
.tbl tbody tr:nth-child(even){background:var(--tint)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--tint-2)}
.tbl tbody tr.on{background:#F6E9D6;box-shadow:inset 3px 0 0 var(--pick)}
.tbl tbody tr.on td{font-weight:700}
.tbl tfoot td{background:var(--tint-2);font-weight:700;border-bottom:0}
.tbl .cur{font-weight:800}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:6px 9px;line-height:1.4;max-width:220px;z-index:5}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--ink-2);font-size:12.5px;margin-top:16px;border-top:1px solid var(--rule);padding-top:10px}
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .mapbox{z-index:2;box-shadow:0 1px 0 var(--rule)}
  .info{min-height:0}
}
@media (prefers-reduced-motion:reduce){path.r{transition:none}}
</style>
</head>

const STOPS=['#E4F2EA','#8CC7A8','#3E9A6E','#1E7B57','#0E4A33'];
const MET={med_c:{name:'단지 기준 중위 나이',unit:'년'},med_h:{name:'세대 기준 중위 나이',unit:'년'},old_c:{name:'30년 이상 단지 비율',unit:'%'}};
let view='sido', metric='med_c', sel=null, sortKey='med_c', sortDir=-1;
const $=id=>document.getElementById(id), svg=$('map'), tip=$('tip');
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function color(t){t=Math.max(0,Math.min(1,t));const s=t*(STOPS.length-1),i=Math.min(Math.floor(s),STOPS.length-2),f=s-i;const a=hex(STOPS[i]),b=hex(STOPS[i+1]);return `rgb(${a.map((v,j)=>Math.round(v+(b[j]-v)*f)).join(',')})`}
function lum(t){return t>0.42}
function rows(){return Object.entries(view==='sido'?D.sido:D.seoul).map(([k,v])=>({id:k,...v}))}
function domain(){const v=rows().map(r=>r[metric]);return [Math.floor(Math.min(...v)),Math.ceil(Math.max(...v))]}
function fmt(v,u){return v==null?'–':v.toFixed(1)+u}
function draw(){
  const G=D.geo[view], [lo,hi]=domain();
  svg.setAttribute('viewBox',`0 0 ${G.w} ${G.h}`);
  let h='';
  for(const [k,r] of Object.entries(G.regions)){
    const v=(view==='sido'?D.sido:D.seoul)[k][metric], t=(v-lo)/(hi-lo);
    h+=`<path class="r${sel&&sel!==k?' dim':''}" d="${r.d}" fill="${color(t)}" data-id="${k}" tabindex="0" role="button" aria-label="${k} ${fmt(v,MET[metric].unit)}"${view==='sido'?' style="stroke:'+color(t)+'"':''}></path>`;
  }
  if(G.borders) h+=`<path class="borders" d="${G.borders}"></path>`;
  if(sel) h+=`<path class="sel" d="${G.regions[sel].o||G.regions[sel].d}"></path>`;
  for(const [k,r] of Object.entries(G.regions)){
    const v=(view==='sido'?D.sido:D.seoul)[k][metric], t=(v-lo)/(hi-lo), dark=lum(t);

    const fs=view==='sido'?30:24;
    const val=metric==='old_c'?v.toFixed(0):v.toFixed(1);

function table(){
  const t=$('tbl');

  const rs=rows().sort((a,b)=>sortKey==='id'?a.id.localeCompare(b.id,'ko')*sortDir:(a[sortKey]-b[sortKey])*sortDir);

  const N=view==='sido'?D.nat:null, S=view==='seoul'?Object.values(D.seoul):null;
  t.tFoot.innerHTML=N?`<tr><td>전국</td><td>${N.n.toLocaleString('ko-KR')}</td><td>${N.med_c.toFixed(1)}</td><td>${N.med_h.toFixed(1)}</td><td>${N.old_c.toFixed(1)}</td></tr>`
    :`<tr><td>서울 전체</td><td>${D.sido['서울'].n.toLocaleString('ko-KR')}</td><td>${D.sido['서울'].med_c.toFixed(1)}</td><td>${D.sido['서울'].med_h.toFixed(1)}</td><td>${D.sido['서울'].old_c.toFixed(1)}</td></tr>`;
}
function info(){
  const el=$('info');
  if(!sel){el.innerHTML=`<p class="hint">${view==='sido'?'시도':'구'}를 누르면 자세한 숫자가 여기에 나옵니다.</p>`;return}
  const r=(view==='sido'?D.sido:D.seoul)[sel];
  el.innerHTML=`<h3>${sel}</h3><dl>
   <dt>단지 수 · 세대 수</dt><dd>${r.n.toLocaleString('ko-KR')}곳 · ${r.hh.toLocaleString('ko-KR')}세대</dd>
   <dt>중위 나이 (단지 · 세대)</dt><dd>${r.med_c.toFixed(1)}년 · ${r.med_h.toFixed(1)}년</dd>
   <dt>아파트 · 주상복합</dt><dd>${fmt(r.apt,'년')} · ${fmt(r.mix,'년')} (${r.mix_n}곳)</dd>
   <dt>30년 이상 (단지 · 세대)</dt><dd>${r.old_c.toFixed(1)}% · ${r.old_h.toFixed(1)}%</dd></dl>`;
}
function render(){draw();table();info()}
function pick(id,fromMap){
  sel=(sel===id)?null:id; render();
  if(sel&&fromMap){const tr=$('tbl').querySelector(`tr[data-id="${CSS.escape(sel)}"]`); tr&&tr.scrollIntoView({block:'nearest',behavior:'smooth'})}
}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;sel=null;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()}));
document.querySelectorAll('[data-metric]').forEach(b=>b.addEventListener('click',()=>{metric=b.dataset.metric;sortKey=metric;sortDir=-1;document.querySelectorAll('[data-metric]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()}));
svg.addEventListener('click',e=>{const p=e.target.closest('path.r');if(p)pick(p.dataset.id,true)});
svg.addEventListener('keydown',e=>{const p=e.target.closest('path.r');if(p&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(p.dataset.id,true)}});
svg.addEventListener('mousemove',e=>{const p=e.target.closest('path.r');if(!p){tip.hidden=true;return}
  const r=(view==='sido'?D.sido:D.seoul)[p.dataset.id];tip.hidden=false;
  tip.innerHTML=`<b>${p.dataset.id}</b><br>단지 ${r.med_c.toFixed(1)}년 · 세대 ${r.med_h.toFixed(1)}년<br>30년 이상 ${r.old_c.toFixed(1)}%`;
  tip.style.left=Math.min(e.clientX+14,innerWidth-230)+'px';tip.style.top=(e.clientY+14)+'px'});
svg.addEventListener('mouseleave',()=>tip.hidden=true);
$('tbl').addEventListener('click',e=>{const th=e.target.closest('th');if(th){const k=th.dataset.k;sortDir=(sortKey===k)?-sortDir:(k==='id'?1:-1);sortKey=k;table();return}
  const tr=e.target.closest('tbody tr');if(tr)pick(tr.dataset.id,false)});
$('tbl').addEventListener('keydown',e=>{const tr=e.target.closest('tbody tr');if(tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(tr.dataset.id,false)}});
if(location.hash==='#seoul'){view='seoul';document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.view==='seoul'))}
render();
</script>

</body>
</html>
